# BOS — Nginx site (single domain: SPA at /, Laravel API at /api).
# Placeholders are filled in by deploy/install-debian.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/frontend/dist;
    index index.html;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel API (+ health check)
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __APP_DIR__/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   __APP_DIR__/backend/public;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_read_timeout 120;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
